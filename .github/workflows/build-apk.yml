
name: Build AI Office Ultimate APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Prepare web project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dhie.aiofficeultimate",
            "appName": "AI Office Ultimate",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Office-Ultimate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
